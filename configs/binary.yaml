experiment: rope_defect_yolov8s_binary
num_classes: 1
initial_model: yolov8s.pt
train:
  epochs: 150
  patience: 50
  batch: 8
  imgsz: 640
  pretrained: true
  optimizer: auto
  seed: 42
  deterministic: true
  workers: 2
  close_mosaic: 20
  resume: false
  amp: true
  cache: false
  rect: false
  cos_lr: false
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  nbs: 64
  hsv_h: 0.01
  hsv_s: 0.25
  hsv_v: 0.2
  degrees: 3.0
  translate: 0.04
  scale: 0.2
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 0.25
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  erasing: 0.0
  iou: 0.7
  max_det: 300
  single_cls: false
  val: true
  plots: true
  save: true
