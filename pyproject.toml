[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wire-rope-defect-detection"
version = "0.2.0"
description = "YOLOv8s prototype for drilling wire-rope defect detection with simulated diagnostic fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.58"]
dev = ["pytest>=8,<10"]

[project.scripts]
rope-defect = "rope_defect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
